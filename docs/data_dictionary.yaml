# Data Dictionary - Retail Analytics Decision Support Platform (Module 3 update)
# Source of truth. `python scripts/build_docs.py` renders docs/data_dictionary.md and docs/lineage.md.
# Statistics marked (measured) come from reports/source_profile.json for the pinned source file
# (sha256 32569a66f384...). They describe THAT file, not the business in general.
# Sensitivity classes: S0 public/none, S1 internal business, S2 pseudonymous personal data (restricted), S3 raw identifier (restricted zone only)

source:
  name: Online Retail II
  provider: UCI Machine Learning Repository (dataset 502); Chen, D. (2019)
  format: CSV, UTF-8 text, comma-delimited, header row, 1,067,371 data rows (measured)
  grain: One invoice line (one product on one invoice)
  actual_update_frequency: Static historical snapshot, 2009-12-01 to 2011-12-09; no ongoing updates
  fields:
    - name: Invoice
      source_type: text
      target_type: string
      definition: Invoice number; 6 digits. A leading 'C' marks a cancellation invoice; a leading 'A' marks a bad-debt accounting adjustment.
      nullable: false
      constraints: "Regex ^[A-Za-z]?[0-9]{6}$ (critical). 'C' prefix on 19,494 rows / 8,292 invoices (measured); 'A' prefix on 6 rows."
      sensitivity: S1
      notes: Cancellation invoice numbers do not match any original invoice number in the file (measured 0%), so cancellations cannot be linked to the sale they reverse.
    - name: StockCode
      source_type: text
      target_type: string
      definition: Product (SKU) code; 5 digits optionally followed by letters. Also holds non-merchandise ledger codes (POST, DOT, M, BANK CHARGES, ...).
      nullable: false
      constraints: "Upper-cased and trimmed on ingestion (3,471 lowercase rows, measured). Merchandise patterns and non-merchandise patterns are listed in configs/pipeline.yaml."
      sensitivity: S0
      notes: 62 distinct codes do not match the 5-digit pattern (measured); most are ledger lines, some are legitimate DCGS-series items.
    - name: Description
      source_type: text
      target_type: string
      definition: Free-text product name; occasionally a ledger memo.
      nullable: true
      constraints: "4,382 missing rows (0.41%, measured), all with price 0 and no customer. Trimmed, whitespace-collapsed, personal-name patterns redacted."
      sensitivity: S1
      notes: "213,035 rows carry leading/trailing whitespace; 1,212 stock codes have more than one description (measured). 71 raw rows contain a staff first name after 'adjustment by/found by' (measured) - redacted."
    - name: Quantity
      source_type: text
      target_type: int64
      definition: Units on the line. Negative on cancellations.
      nullable: false
      constraints: "Integer. Negative allowed ONLY on 'C' invoices in published data. 22,950 negative rows raw: 19,493 on C invoices, 3,457 on non-C invoices (stock adjustments, price 0, no customer) (measured)."
      sensitivity: S0
      notes: Range -80,995 to 80,995 (measured); the extreme pair is a sale and its cancellation on the same product.
    - name: InvoiceDate
      source_type: text
      target_type: datetime
      definition: Invoice timestamp to the second (retailer local time, timezone not stated in source).
      nullable: false
      constraints: "Format YYYY-MM-DD HH:MM:SS (critical). 2009-12-01 07:45:00 to 2011-12-09 12:50:00 (measured). December 2011 is a partial month."
      sensitivity: S1
      notes: Timestamps are quasi-identifying in combination with Country and basket contents. One backward step in file order (2010-12-09 -> 2010-12-01 at row 525,461) marks a block boundary.
    - name: Price
      source_type: text
      target_type: float64
      definition: Unit price in GBP (currency stated by dataset documentation, not in the file).
      nullable: false
      constraints: "Decimal, up to 3 decimals. Zero on 6,202 rows; negative on 5 rows ('Adjust bad debt'); maximum 38,970 on a 'Manual' line (measured). Published lines require price > 0."
      sensitivity: S1
      notes: ""
    - name: Customer ID
      source_type: text
      target_type: Int64 (transient; never persisted outside bronze)
      definition: Retailer's customer number, stored as a float-like string (e.g. 13085.0).
      nullable: true
      constraints: "243,007 missing rows (22.77%, measured); 5,942 distinct values. Regex ^[0-9]+(\\.0+)?$ when present."
      sensitivity: S3
      notes: Pseudonymous identifier. Replaced by customer_key (HMAC-SHA256) before any table leaves the bronze zone. Missing values are retained as unidentified transactions.
    - name: Country
      source_type: text
      target_type: string
      definition: Customer's country as recorded by the retailer.
      nullable: false
      constraints: "43 distinct values (measured); includes 'Unspecified' (756 rows) and 'European Community'. United Kingdom = 981,330 rows (measured)."
      sensitivity: S1
      notes: Quasi-identifier for small countries. Only group attribute available for representation checks.

provenance_fields:
  - {name: raw_row_id, type: int64, definition: "Zero-based position of the data row in the source CSV; links every output row back to bronze.", sensitivity: S1}

disposition_layout:
  description: "Every raw row has exactly one disposition (retained / quarantined / excluded) and a reason code. Stored in the restricted silver zone."
  columns:
    - {name: disposition, type: string, definition: "retained | quarantined | excluded"}
    - {name: reason_code, type: string, definition: "OK or a code from cleaning.REASON_ORDER (EXC_DUP_OVERLAP, EXC_NON_MERCHANDISE, QRN_*)"}

outputs:
  fact_sales_line:
    description: Retained invoice lines (sales and cancellations) with business measures. Grain - one invoice line.
    columns:
      - {name: line_id, type: string, nullable: false, key: PK, derived: true, lineage: [Invoice], sensitivity: S1,
         definition: "Invoice number + '-' + 4-digit ordinal of the line within its invoice in source row order; deterministic unique key."}
      - {name: raw_row_id, type: int64, nullable: false, derived: false, lineage: [], sensitivity: S1, definition: "Source CSV row position (traceability)."}
      - {name: invoice_no, type: string, nullable: false, derived: true, lineage: [Invoice], sensitivity: S1, definition: "Invoice trimmed and upper-cased."}
      - {name: stock_code, type: string, nullable: false, fk: dim_product.stock_code, derived: true, lineage: [StockCode], sensitivity: S0, definition: "Merchandise stock code, upper-cased."}
      - {name: invoice_ts, type: datetime, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S1, definition: "Parsed invoice timestamp."}
      - {name: invoice_date, type: datetime, nullable: false, fk: dim_date.date, derived: true, lineage: [InvoiceDate], sensitivity: S1, definition: "Invoice date at midnight."}
      - {name: quantity, type: int64, nullable: false, derived: true, lineage: [Quantity], sensitivity: S0, definition: "Units; non-zero; negative only on cancellation invoices."}
      - {name: unit_price, type: float64, nullable: false, derived: true, lineage: [Price], sensitivity: S1, definition: "Unit price GBP, greater than 0 and at most 10,000 (configured)."}
      - {name: line_revenue, type: float64, nullable: false, derived: true, lineage: [Quantity, Price], sensitivity: S1, definition: "quantity x unit_price rounded to 4 dp; negative for cancellations."}
      - {name: is_cancellation, type: bool, nullable: false, derived: true, lineage: [Invoice], sensitivity: S0, definition: "True when the invoice number starts with 'C'."}
      - {name: customer_key, type: string, nullable: true, fk: dim_customer.customer_key, derived: true, lineage: [Customer ID], sensitivity: S2, definition: "32-hex keyed HMAC-SHA256 pseudonym of Customer ID; null when Customer ID is missing. Pseudonymous, not anonymous."}
      - {name: customer_identified, type: bool, nullable: false, derived: true, lineage: [Customer ID], sensitivity: S0, definition: "True when customer_key is present."}
      - {name: country, type: string, nullable: false, derived: true, lineage: [Country], sensitivity: S1, definition: "Country, trimmed."}
      - {name: source_block, type: int8, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "1 or 2: which side of the single backward step in InvoiceDate (file order) the row sits on. INFERRED; the CSV does not record worksheet names."}
      - {name: is_exact_duplicate_within_source, type: bool, nullable: false, derived: true, lineage: [Invoice, StockCode, Description, Quantity, InvoiceDate, Price, Customer ID, Country], sensitivity: S0, definition: "Row is identical on all eight raw fields to an earlier retained row. Retained and flagged (may be a legitimate repeated scan)."}
  dim_product:
    description: One row per merchandise stock code present in the fact table.
    columns:
      - {name: stock_code, type: string, nullable: false, key: PK, derived: true, lineage: [StockCode], sensitivity: S0, definition: "Merchandise stock code."}
      - {name: description, type: string, nullable: false, derived: true, lineage: [Description], sensitivity: S1, definition: "Most frequent upper-cased description (ties alphabetical); personal-name patterns redacted."}
      - {name: n_description_variants, type: int64, nullable: false, derived: true, lineage: [Description], sensitivity: S0, definition: "Distinct upper-cased descriptions seen for the code."}
      - {name: first_sold_date, type: datetime, nullable: true, derived: true, lineage: [InvoiceDate, Invoice], sensitivity: S1, definition: "First date with a non-cancelled line."}
      - {name: last_sold_date, type: datetime, nullable: true, derived: true, lineage: [InvoiceDate, Invoice], sensitivity: S1, definition: "Last date with a non-cancelled line."}
      - {name: n_lines, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S0, definition: "Retained lines (sales and cancellations)."}
      - {name: median_unit_price, type: float64, nullable: true, derived: true, lineage: [Price], sensitivity: S1, definition: "Median unit price over non-cancelled lines."}
  dim_customer:
    description: One row per pseudonymised customer present in the fact table.
    columns:
      - {name: customer_key, type: string, nullable: false, key: PK, derived: true, lineage: [Customer ID], sensitivity: S2, definition: "Keyed pseudonym (see fact_sales_line.customer_key)."}
      - {name: country_primary, type: string, nullable: false, derived: true, lineage: [Country], sensitivity: S2, definition: "Most frequent country over the customer's lines (ties alphabetical)."}
      - {name: n_countries, type: int64, nullable: false, derived: true, lineage: [Country], sensitivity: S2, definition: "Distinct countries seen for the customer (13 customers have more than one in the raw data; measured)."}
      - {name: first_purchase_date, type: datetime, nullable: true, derived: true, lineage: [InvoiceDate, Invoice], sensitivity: S2, definition: "First non-cancelled purchase date."}
      - {name: last_purchase_date, type: datetime, nullable: true, derived: true, lineage: [InvoiceDate, Invoice], sensitivity: S2, definition: "Last non-cancelled purchase date."}
      - {name: n_sales_invoices, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S2, definition: "Distinct non-cancellation invoices."}
      - {name: n_cancellation_invoices, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S2, definition: "Distinct cancellation invoices."}
  dim_date:
    description: One row per calendar day between the first and last retained invoice date.
    columns:
      - {name: date, type: datetime, nullable: false, key: PK, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "Calendar day."}
      - {name: year, type: int64, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "Calendar year."}
      - {name: month, type: int64, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "Calendar month 1-12."}
      - {name: iso_year, type: int64, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "ISO year."}
      - {name: iso_week, type: int64, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "ISO week 1-53."}
      - {name: week_start, type: datetime, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "Monday of the ISO week."}
      - {name: day_of_week, type: int64, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "0 = Monday ... 6 = Sunday."}
      - {name: is_partial_month, type: bool, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "True when the month is not fully inside the observed window (December 2011)."}
  agg_daily_sales:
    description: Daily sales and cancellations by country. Grain - one calendar day x country.
    columns:
      - {name: invoice_date, type: datetime, nullable: false, key: PK, fk: dim_date.date, derived: true, lineage: [InvoiceDate], sensitivity: S1, definition: "Invoice date."}
      - {name: country, type: string, nullable: false, key: PK, derived: true, lineage: [Country], sensitivity: S1, definition: "Country."}
      - {name: sales_invoices, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S0, definition: "Distinct non-cancellation invoices."}
      - {name: sale_lines, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S0, definition: "Non-cancellation lines."}
      - {name: units_sold, type: int64, nullable: false, derived: true, lineage: [Quantity], sensitivity: S0, definition: "Units on non-cancellation lines."}
      - {name: gross_sales_revenue, type: float64, nullable: false, derived: true, lineage: [Quantity, Price], sensitivity: S1, definition: "Sum of line_revenue on non-cancellation lines."}
      - {name: cancellation_invoices, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S0, definition: "Distinct cancellation invoices."}
      - {name: cancellation_lines, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S0, definition: "Cancellation lines."}
      - {name: units_cancelled, type: int64, nullable: false, derived: true, lineage: [Quantity], sensitivity: S0, definition: "Absolute units on cancellation lines."}
      - {name: cancellation_revenue, type: float64, nullable: false, derived: true, lineage: [Quantity, Price], sensitivity: S1, definition: "Sum of line_revenue on cancellation lines (zero or negative)."}
      - {name: net_revenue, type: float64, nullable: false, derived: true, lineage: [Quantity, Price], sensitivity: S1, definition: "gross_sales_revenue + cancellation_revenue."}
  agg_weekly_sku_demand:
    description: Weekly demand by product. Grain - one ISO week (Monday start) x stock code; sparse, weeks with no lines are absent.
    columns:
      - {name: week_start, type: datetime, nullable: false, key: PK, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "Monday of the ISO week."}
      - {name: stock_code, type: string, nullable: false, key: PK, fk: dim_product.stock_code, derived: true, lineage: [StockCode], sensitivity: S0, definition: "Stock code."}
      - {name: units_sold, type: int64, nullable: false, derived: true, lineage: [Quantity], sensitivity: S0, definition: "Units on non-cancellation lines."}
      - {name: gross_sales_revenue, type: float64, nullable: false, derived: true, lineage: [Quantity, Price], sensitivity: S1, definition: "Revenue on non-cancellation lines."}
      - {name: n_sales_invoices, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S0, definition: "Distinct non-cancellation invoices."}
      - {name: units_cancelled, type: int64, nullable: false, derived: true, lineage: [Quantity], sensitivity: S0, definition: "Absolute units on cancellation lines."}
      - {name: cancellation_revenue, type: float64, nullable: false, derived: true, lineage: [Quantity, Price], sensitivity: S1, definition: "Revenue on cancellation lines (zero or negative)."}
      - {name: net_units, type: int64, nullable: false, derived: true, lineage: [Quantity], sensitivity: S0, definition: "units_sold - units_cancelled."}
  agg_customer_rfm_base:
    description: Inputs for RFM segmentation per pseudonymised customer. Grain - one customer. Recency is measured to the snapshot date (last observed date + 1 day).
    columns:
      - {name: customer_key, type: string, nullable: false, key: PK, fk: dim_customer.customer_key, derived: true, lineage: [Customer ID], sensitivity: S2, definition: "Keyed pseudonym."}
      - {name: first_purchase_date, type: datetime, nullable: true, derived: true, lineage: [InvoiceDate, Invoice], sensitivity: S2, definition: "First non-cancelled purchase date."}
      - {name: last_purchase_date, type: datetime, nullable: true, derived: true, lineage: [InvoiceDate, Invoice], sensitivity: S2, definition: "Last non-cancelled purchase date."}
      - {name: frequency_invoices, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S2, definition: "Distinct non-cancellation invoices."}
      - {name: monetary_gross, type: float64, nullable: false, derived: true, lineage: [Quantity, Price], sensitivity: S2, definition: "Sum of line_revenue on non-cancellation lines."}
      - {name: monetary_net, type: float64, nullable: false, derived: true, lineage: [Quantity, Price], sensitivity: S2, definition: "Sum of line_revenue including cancellations."}
      - {name: n_cancellation_invoices, type: int64, nullable: false, derived: true, lineage: [Invoice], sensitivity: S2, definition: "Distinct cancellation invoices."}
      - {name: recency_days, type: Int64, nullable: true, derived: true, lineage: [InvoiceDate], sensitivity: S2, definition: "snapshot_date - last_purchase_date in days; null if the customer has no non-cancelled purchase."}
      - {name: snapshot_date, type: datetime, nullable: false, derived: true, lineage: [InvoiceDate], sensitivity: S0, definition: "Last observed invoice date + 1 day (data-derived, deterministic)."}
